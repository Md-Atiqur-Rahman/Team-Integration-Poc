<main class="app-shell">
  @if (showDashboard) {
    <app-teams-dashboard />
  } @else {
    @switch (flow.step()) {
      @case ('chooseOrg') {
        <app-choose-organization />
      }
      @case ('chooseProject') {
        <app-choose-project />
      }
      @default {
        <app-demo-login />
      }
    }
  }
</main>
